<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mi proyecto de Programación Web: galería hecha con HTML5 y CSS3." />
  <meta name="author" content="Karla Daniela Ramírez Ortegón" />
  <title>Karla Daniela | Mi proyecto</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>

  <header class="main-header" id="top">
    <a class="logo" href="header.html">
      <span class="logo-icon">&#9670;</span>
      <span class="logo-text">Karla Daniela</span>
    </a>

    <!-- Menú principal -->
    <nav class="main-nav" id="main-nav" aria-label="Menú principal">
      <ul class="nav-list">
        <li><a href="header.html" class="nav-link active">Inicio</a></li>
        <li><a href="companeros.html" class="nav-link">Compañeros</a></li>
      </ul>
    </nav>

    <!-- Botón hamburguesa para el menú del celular -->
    <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <div id="contenedorPrincipal">

    <!-- Sección 1 -->
    <div class="seccion">
      <div class="caja s1 t">Hogwarts, el colegio de magia y hechicería</div>
      <div class="caja s1">
        <img src="https://media.posterstore.com/site_images/68631b0f92c536b9cc92b033_1852152599_WB0012-5.jpg" alt="Hogwarts, Harry Potter">
      </div>
      <div class="caja s1">
        <a class="video" href="https://youtu.be/xBAeOTHtZVg" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/xBAeOTHtZVg/hqdefault.jpg" alt="Ver video 1">
        </a>
      </div>
      <div class="caja s1 naranja"></div>
    </div>

    <!-- Sección 2 -->
    <div class="seccion">
      <div class="caja s2 s2_i">
        <a class="video" href="https://youtu.be/99Na0JdiZKM" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/99Na0JdiZKM/hqdefault.jpg" alt="Ver video 2">
        </a>
      </div>
      <div class="caja s2 s2_i">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcmuoFlEiUbFg7hu-IOBTK49Qpg9c99LIzbwaZCnVFu36G8sm24CBEnw40&amp;s=10" alt="Castillo de Hogwarts">
      </div>
      <div class="s2 s2_derecha">
        <div class="caja s2_D_superior t">Las cuatro casas: coraje, ambición, inteligencia y lealtad</div>
        <div class="caja s2_D_inferior naranja"></div>
      </div>
    </div>

    <!-- Sección 3 -->
    <div class="seccion">
      <div class="caja s3_superior">
        <a class="video" href="https://youtu.be/qrB-u9izo80" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/qrB-u9izo80/hqdefault.jpg" alt="Ver video 3">
        </a>
      </div>
      <div class="caja s3_superior">
        <a class="video" href="https://youtu.be/JqpAtf4ygRI" target="_blank" rel="noopener">
          <img src="https://img.youtube.com/vi/JqpAtf4ygRI/hqdefault.jpg" alt="Ver video 4">
        </a>
      </div>
      <div class="caja s3_inferior">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8j0I3AZ3uKYhf4q1FTMIGjCehkESQwIb9qLJof5vw5BHEt_s00nWfjfY&amp;s=10" alt="Expreso de Hogwarts">
      </div>
    </div>

  </div>

  <footer>
    Karla Daniela Ramírez Ortegón &mdash; 05-04-2009
  </footer>

  <script>
    // Abre y cierra el menú en el celular
    const hamburger = document.getElementById("hamburger");
    const nav = document.getElementById("main-nav");

    hamburger.addEventListener("click", function () {
      nav.classList.toggle("nav-open");
      hamburger.classList.toggle("active");
    });
  </script>
</body>
</html>
